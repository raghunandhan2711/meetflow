services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: minutes
      POSTGRES_USER: minutes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minutes}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - minutes_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minutes"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  minutes_postgres:
